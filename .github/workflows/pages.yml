name: 构建手机端站点

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "config/**"
      - "web/**"
      - "scripts/**"
      - "site.config.json"
  workflow_run:
    workflows: ["投稿入库", "状态命令"]
    types: [completed]
  schedule:
    # 每天北京时间 09:20 重建，刷新"还有几天开奖"
    - cron: "20 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 生成静态页
        run: node scripts/build-site.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
