name: 自动发现活动

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: discover
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 跑去各平台找活动
        run: node scripts/discover.mjs
      - name: 有新增就提交
        run: |
          git config user.name "lottery-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data config
          if git diff --cached --quiet; then
            echo "没有新活动"
          else
            git commit -m "discover: 自动发现新活动 $(date -u +%FT%TZ)"
            git push
          fi
