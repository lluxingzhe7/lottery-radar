name: 状态命令

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  command:
    if: "startsWith(github.event.comment.body, '/')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 执行命令
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: node scripts/issue-command.mjs
      - name: 提交台账
        run: |
          git config user.name "lottery-radar-bot"
          git config user.email "lottery-radar-bot@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "台账没有变化"
          else
            git commit -m "status: comment by ${{ github.event.comment.user.login }}"
            git push
          fi
      - name: 回帖
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue comment "${{ github.event.issue.number }}" --body-file .out/comment.md
